services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  artex:
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
        INSTALL_NETEXEC: ${INSTALL_NETEXEC:-0}
    image: ${ARTEX_IMAGE:-artex-oldwei}:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_KB_DIR: /state/redteam
      ARTEX_GATE: ${ARTEX_GATE:-on}
      ARTEX_SKILL_DIR: /state/skills
      ARTEX_CONFIG: /state/config.json
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: artex
      PGDATABASE: artex
      APPLY_DEFAULTS: ${APPLY_DEFAULTS:-1}
      HOME: /state/home
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ARTEX_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_PROXY_PORT:-8788}:8788"
    volumes:
      - ./state:/state
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
