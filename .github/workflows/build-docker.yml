name: build-docker

# 方案 A：仓库只存代码/技能/脚本；toolkit、POC、知识库、nuclei 模板、artex 二进制
# 放在一个 GitHub Release 资产里，构建时下载并校验 SHA256。
#
# 首次使用：
#   1. 本地运行 ./pack-redteam-assets.sh
#   2. 新建 Release（tag 例如 assets-20261118），上传 artex-redteam-assets.tar.gz
#   3. 把下面的 ASSET_URL / ASSET_SHA256 改成实际值
#   4. Actions 里手动运行本 workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hwnh3333/artex
  ASSET_URL: https://github.com/hwnh3333/artex/releases/download/assets-20261118/artex-redteam-assets.tar.gz
  ASSET_SHA256: "3f4b653118ac47833f3a5c6a8cb338c1f406b55df2241f2ead3f6c08b8373434"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify redteam assets
        shell: bash
        run: |
          set -euo pipefail
          echo "asset: $ASSET_URL"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 \
            -o /tmp/artex-redteam-assets.tar.gz "$ASSET_URL"
          echo "$ASSET_SHA256  /tmp/artex-redteam-assets.tar.gz" | sha256sum -c -
          tar -xzf /tmp/artex-redteam-assets.tar.gz -C .
          test -f ./artex-amd64
          chmod +x ./artex-amd64
          test -f ./redteam/knowledge.db
          test -d ./redteam/toolkit/nuclei
          test -d ./redteam/pocs
          test -d ./nuclei-templates
          du -sh artex-amd64 redteam nuclei-templates

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            TARGETARCH=amd64
            ARTEX_BIN=artex-amd64
            INSTALL_NETEXEC=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Docker 镜像构建完成"
            echo ""
            echo "- 镜像：\`${{ env.IMAGE }}:latest\`"
            echo "- commit：\`${{ github.sha }}\`"
            echo "- 架构：\`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"
